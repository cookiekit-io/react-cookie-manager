version: 2
updates:
  # Library dev/build tooling
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Vite demo app
  - package-ecosystem: npm
    directory: "/playground"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      playground:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Next.js demo app
  - package-ecosystem: npm
    directory: "/playground-next"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      playground-next:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
